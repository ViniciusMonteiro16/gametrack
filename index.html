<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTrack - Sua biblioteca de jogos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container">
        <h1>GameTrack</h1>
        <p>Sua biblioteca de jogos</p>
    </div>
</header>

<main class="container">

    <section class="dashboard">

        <div class="stat-card">
            <h2 id="totalJogos">0</h2>
            <p>Jogos cadastrados</p>
        </div>

        <div class="stat-card">
            <h2 id="jogando">0</h2>
            <p>Jogando</p>
        </div>

        <div class="stat-card">
            <h2 id="finalizados">0</h2>
            <p>Finalizados</p>
        </div>

    </section>

    <section class="filtros">

        <div class="campo-pesquisa">
            <label for="pesquisa">Pesquisar jogo</label>

            <input
                type="text"
                id="pesquisa"
                placeholder="Digite o nome do jogo..."
            >
        </div>

        <div class="campo-filtro">
            <label for="filtroStatus">Status</label>

            <select id="filtroStatus">
                <option value="Todos">Todos</option>
                <option value="Quero jogar">Quero jogar</option>
                <option value="Jogando">Jogando</option>
                <option value="Finalizado">Finalizado</option>
                <option value="Abandonado">Abandonado</option>
            </select>
        </div>

    </section>

    <div id="mensagem" class="mensagem"></div>

    <section>
        <h2>Meus jogos</h2>

        <div id="listaJogos" class="lista-jogos"></div>
    </section>

    <section class="formulario-section">

        <h2 id="tituloFormulario">Cadastrar novo jogo</h2>

        <form id="formJogo">

            <input type="hidden" id="idJogo">

            <div class="campo">
                <label for="titulo">Título</label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Ex: Rocket League"
                    required
                >
            </div>

            <div class="campo">
                <label for="genero">Gênero</label>

                <input
                    type="text"
                    id="genero"
                    placeholder="Ex: Esportes"
                    required
                >
            </div>

            <div class="campo">
                <label for="plataforma">Plataforma</label>

                <input
                    type="text"
                    id="plataforma"
                    placeholder="Ex: PC"
                    required
                >
            </div>

            <div class="campo">
                <label for="nota">Nota</label>

                <input
                    type="number"
                    id="nota"
                    min="0"
                    max="10"
                    step="0.1"
                    placeholder="0 a 10"
                    required
                >
            </div>

            <div class="campo">
                <label for="status">Status</label>

                <select id="status" required>
                    <option value="">Selecione o status</option>
                    <option value="Quero jogar">Quero jogar</option>
                    <option value="Jogando">Jogando</option>
                    <option value="Finalizado">Finalizado</option>
                    <option value="Abandonado">Abandonado</option>
                </select>
            </div>

            <div class="botoes-formulario">

                <button type="submit" id="btnSalvar">
                    Cadastrar jogo
                </button>

                <button
                    type="button"
                    id="btnCancelar"
                    hidden
                >
                    Cancelar edição
                </button>

            </div>

        </form>

    </section>

</main>

<footer>
    <p>GameTrack</p>
</footer>

<script src="script.js"></script>

</body>
</html>
